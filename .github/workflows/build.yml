name: Build and release Windows exe

# Runs on every push to a tag like "v1.0.0", and can also be triggered
# manually from the Actions tab (useful for testing the build without
# publishing a release).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ColorGrabber.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ColorGrabber --icon assets\icon.ico main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorGrabber-windows
          path: dist/ColorGrabber.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ColorGrabber.exe
          generate_release_notes: true
